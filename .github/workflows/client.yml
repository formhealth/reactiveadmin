name: client

on:
  push:
    branches: [main]
    paths: ["apps/**", "openapi/**", "gem/**", "package.json", "pnpm-*.yaml", ".nvmrc", ".github/actions/**", ".github/workflows/client.yml"]
  workflow_dispatch:
  pull_request:

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-client
      - name: Contract drift (generated client matches openapi/core.yaml)
        run: |
          pnpm gen
          git status --short
          test -z "$(git status --porcelain)" || { git diff --stat; echo "::error::Run 'pnpm gen' and commit the result."; exit 1; }
      - run: pnpm --filter standalone typecheck
      - run: pnpm --filter standalone lint
      - run: pnpm --filter standalone test
      - run: pnpm build
      - name: Host build (the files and manifest a Rails shell loads)
        run: |
          RA_OUT_DIR="$RUNNER_TEMP/host-build" RA_ASSET_PREFIX=/reactiveadmin/ pnpm --filter standalone build:host
          grep -q '"index.html"' "$RUNNER_TEMP/host-build/manifest.json"
          grep -q '"src/classic/uiToggle.ts"' "$RUNNER_TEMP/host-build/manifest.json"

  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-client
      - run: pnpm --filter standalone build-storybook
        env:
          TZ: UTC

  # Runs every story in Chromium under axe (light and dark); fails on serious/critical WCAG 2.2 AA violations.
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-client
        with:
          playwright: "true"
      - run: pnpm --filter standalone a11y

  # Boots the gem's dummy app and the client, then opens every screen the manifest describes.
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: gem
      - uses: ./.github/actions/setup-client
        with:
          playwright: "true"
      - run: pnpm crawl:dummy
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: crawl-report
          path: apps/standalone/crawl-report
          if-no-files-found: ignore
