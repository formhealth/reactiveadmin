name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and smoke test the gem without publishing it.
        type: boolean
        default: true

permissions:
  contents: read

# Actions are pinned to commits: the publish job holds the RubyGems OIDC token, and the build job makes the gem it publishes.
jobs:
  # Builds with no credentials, so the OIDC token is only ever available to the publish job below.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUNDLE_DEPLOYMENT: "false"
      BUNDLE_FROZEN: "false"
    defaults:
      run:
        working-directory: gem
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-client
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: gem
      - name: Verify the tag matches the gem version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          version=$(ruby -r ./lib/reactive_admin/version -e 'print ReactiveAdmin::VERSION')
          if [ "$REF_TYPE" != tag ]; then
            [ "$DRY_RUN" = true ] || { echo "::error::Publishing needs a v* tag, not $REF_TYPE $REF_NAME."; exit 1; }
            echo "Dry run on $REF_NAME: not checking the tag."
          elif [ "$REF_NAME" != "v$version" ]; then
            echo "::error::Tag $REF_NAME does not match ReactiveAdmin::VERSION (v$version)."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: bundle exec rake package
      - name: Smoke test the packaged gem
        run: script/smoke_packaged_gem.sh
      - name: Extract the release notes from the CHANGELOG
        run: |
          # The heading's version is compared as a string: in a regex, the dots in 1.0.0.rc1 would also match 1.0.0-rc1.
          awk -v v="$VERSION" '/^## /{h = $2; gsub(/^\[|\]$/, "", h); found = (h == v); next} found' ../CHANGELOG.md > pkg/notes.md
          grep -q "[^[:space:]]" pkg/notes.md || { echo "::error::CHANGELOG.md has no section for $VERSION."; exit 1; }
          cat pkg/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: gem/pkg
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Maintainers approve the publish here. rubygems.org's trusted publisher is bound to this environment name.
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      # configure-rubygems-credentials can't send `owner`, which RubyGems needs before a trusted publisher may create a new gem.
      - name: Exchange the OIDC token for a RubyGems API key
        env:
          OWNER: ${{ vars.RUBYGEMS_OWNER }}
        run: |
          jwt=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rubygems.org" | jq -er .value)
          body=$(jq -n --arg jwt "$jwt" --arg owner "$OWNER" '{jwt: $jwt} + (if $owner == "" then {} else {owner: $owner} end)')
          resp=$(curl -sS --fail-with-body -H "Content-Type: application/json" -d "$body" https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token) || { echo "::error::$resp"; exit 1; }
          key=$(jq -er .rubygems_api_key <<< "$resp")
          echo "::add-mask::$key"
          echo "GEM_HOST_API_KEY=$key" >> "$GITHUB_ENV"
      # A rerun after a later step failed must not fail here: RubyGems refuses a version it already has.
      - name: Push the gem
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if curl -fsS -o /dev/null "https://rubygems.org/api/v2/rubygems/reactiveadmin/versions/$version.json"; then
            echo "::notice::reactiveadmin $version is already on RubyGems; not pushing it again."
          else
            gem push release/*.gem
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          ruby -e 'exit Gem::Version.new(ARGV[0]).prerelease?' "${TAG#v}" && flags+=(--prerelease)
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && { echo "::notice::Release $TAG exists."; exit 0; }
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file release/notes.md "${flags[@]}"
