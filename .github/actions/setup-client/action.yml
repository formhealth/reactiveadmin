name: Set up the client
description: Install pnpm, Node and the workspace dependencies from the lockfile.

inputs:
  playwright:
    description: Install Playwright's Chromium and its system dependencies.
    default: "false"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - if: inputs.playwright == 'true'
      run: pnpm --filter standalone exec playwright install --with-deps chromium
      shell: bash
